# ═══ 2026-10-01 性能批（批 CY-㊴ 之十九）：可观测性 —— 让「慢」能被定位 ═══
#
# 为什么要有这个文件：nginx 的 access_log **默认格式里没有耗时字段**。
# 上一次查全站延迟，只能临时上手加一行、再手工 grep —— 下次再遇到又得重来一遍，
# 而且改的是 /etc/nginx/nginx.conf，**部署脚本不管那个文件**，改完下次部署不会被覆盖、
# 也不会有人知道它存在过（改一个"不属于版本管理"的东西，是所有运维事故的经典开头）。
#
# `log_format` 只能在 **http** 上下文声明，而部署脚本只管
# /etc/nginx/sites-available/shuimg.cn（server 上下文）—— 所以放在那里写不了。
#
# 解法：nginx.conf 的 http 块里**已经**有 `include /etc/nginx/conf.d/*.conf;`（第 59 行），
# 而 conf.d 目录本来是空的。于是这个文件：
#   · 落在已经被 include 的目录里 ⇒ **不需要改 nginx.conf 一行**
#   · 由仓库版本管理（scripts/nginx/00-shubao-log-format.conf）
#   · 由部署脚本安装（跟 sites-available 那份同一个流程、同一个回滚）
#
# ⚠️ 文件名必须以数字开头并**排在字母类文件之前**：`include` 是按 glob 的字典序展开的，
#    `log_format` 必须在任何用到它的 `access_log` 之前生效。站点文件在 sites-enabled
#    （另一个 include），conf.d 这一层先进，所以这个命名是安全的。
#
# 字段含义：
#   $request_time          从读到第一个字节到**最后一个字节写完**的总耗时（秒，3 位小数）
#   $upstream_response_time 后端耗时；命中静态资源时为 "-"
#   $upstream_connect_time 连后端耗时；命中静态资源时为 "-"
#   $upstream_cache_status 后端缓存命中情况
#   $bytes_sent            实际发给客户端的字节数（**压缩之后**的，可以直接看出压缩有没有生效）

log_format shubao_timing
	'$remote_addr - $remote_user [$time_local] "$request" '
	'$status $body_bytes_sent '
	'rt=$request_time urt=$upstream_response_time uct=$upstream_connect_time '
	'uc=$upstream_cache_status '
	'ref="$http_referer" ua="$http_user_agent"';

# 这一层只是**定义**格式；真正启用要写 access_log（http/server/location 都可以）。
# 这里只开 http 层的全局日志，站点文件（server 块）里可以再按 location 细化。
access_log /var/log/nginx/shubao_timing.log shubao_timing;