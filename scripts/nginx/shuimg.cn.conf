server {
    listen 80;
    server_name shuimg.cn www.shuimg.cn;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name shuimg.cn www.shuimg.cn;

    root /var/www/shubao/current;
    index index.html;

    ssl_certificate /etc/letsencrypt/live/shuimg.cn/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/shuimg.cn/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # ── 2026-10-01 性能①：请求体上限（原 64m）────────────────────────────────────
    # 必须**大于**应用侧上限（server/mediaUploadLimits.mjs，视频 300MB），否则 nginx
    # 会先于应用返回它自己的 413 **英文 HTML 错误页** —— 既不是中文，也没有
    # "上限是多少 / 怎么缩小"。让**应用**永远第一个拒绝。
    # 整站只写这一处：上传都在 /api/ 下，但放到 server 级更不容易出下一次
    # "改了 /api/ 的那份、忘了这里的"这种事故，而多出来的上限对 GET-only 的
    # 静态资源毫无影响。
    client_max_body_size 512m;

    # ── 2026-10-01 性能②：gzip_types（实测发现的最大一处浪费）─────────────────
    # 现象：`gzip on` 本来是有的，但 nginx.conf 里那行 `gzip_types ...` **被注释掉了**，
    # 于是只有默认的 `text/html` 会压缩。实测线上（声明 Accept-Encoding 后）：
    #   /                        -> content-encoding: gzip   [对]
    #   /assets/index-*.js        -> 715693 字节，无 content-encoding   [错]
    #   /assets/style-*.css       -> 864374 字节，无 content-encoding   [错]
    #   /api/video/capabilities   ->  15143 字节，无 content-encoding   [错]
    # 首屏那两个文件压后是 251KB + 138KB ⇒ 1.58MB 变 389KB，每次冷启动白传 1.2MB。
    # `gzip_types` 在 http/server/location 三个上下文都合法；写在这里（本 server 块）
    # 而不是 nginx.conf，是因为**部署脚本管的就是这个文件** —— 写进 nginx.conf 的话
    # 下次部署不会带上，改动就悄悄丢了。
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 256;
    # 刻意**不包含** image/* 与 video/*：png/jpg/webp 本来就压不动，白耗 CPU 而体积不变。
    # application/wasm 压得动（13MB -> 3.4MB），要留。
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/manifest+json
        application/wasm
        application/xml
        application/xml+rss
        image/svg+xml
        font/woff
        font/woff2;

    location ^~ /api/ {
        proxy_pass http://127.0.0.1:3002;
        proxy_http_version 1.1;
        proxy_hide_header X-Content-Type-Options;
        proxy_hide_header X-Frame-Options;
        proxy_hide_header Referrer-Policy;
        proxy_hide_header Permissions-Policy;
        proxy_hide_header Strict-Transport-Security;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_read_timeout 900s;
        proxy_send_timeout 900s;
    }

    location = /health {
        proxy_pass http://127.0.0.1:3002/health;
        proxy_http_version 1.1;
        proxy_hide_header X-Content-Type-Options;
        proxy_hide_header X-Frame-Options;
        proxy_hide_header Referrer-Policy;
        proxy_hide_header Permissions-Policy;
        proxy_hide_header Strict-Transport-Security;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
    }

    # ── 2026-10-01 性能③：静态资源长缓存（实测漏了 webp）───────────────────────
    # 实测线上：
    #   /images/logo.png         -> 1 年 immutable                [对]
    #   /images/logo-icon.webp   -> no-cache, must-revalidate    [错]
    # 而这个站点的图**几乎全是 .webp**（图库缩略图、首页两个入口图），也就是说每次
    # 打开页面都要把这些图重新跟服务器确认一遍。补上 webp/avif/wasm/onnx
    # （wasm 13MB、onnx 4.4MB，本来就只该下一次的）。
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|webp|avif|woff|woff2|wasm|onnx)$ {
        # 只写**一行** Cache-Control。原先是 `expires 1y;`（它自己会发一个
        # `Cache-Control: max-age=31536000`）**加上** `add_header Cache-Control
        # "public, immutable"` ⇒ 响应里出现**两个** Cache-Control 头（实测确认），
        # 格式不合法，只是浏览器容错才没出事。现在合成一行。
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        try_files $uri =404;
    }

    # 9-13 生产事故复盘：静态资源是 1 年 immutable 缓存，但 index.html 原来**没有任何缓存头**，
    # 浏览器会做启发式缓存 —— 部署后旧 HTML 仍指向已被替换的旧 chunk，页面直接打不开。
    # 修法：HTML 强制协商缓存（每次校验），hashed 资源继续长缓存（最优组合）。
    location = /index.html {
        add_header Cache-Control "no-cache, must-revalidate" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    }

    location / {
        # SPA 回退也走 index.html：同样不允许被启发式缓存住
        add_header Cache-Control "no-cache, must-revalidate" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        try_files $uri $uri/ /index.html;
    }
}
