server {
    listen 80;
    server_name shuimg.cn www.shuimg.cn;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name shuimg.cn www.shuimg.cn;

    root /var/www/shubao/current;
    index index.html;

    ssl_certificate /etc/letsencrypt/live/shuimg.cn/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/shuimg.cn/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    client_max_body_size 64m;

    # 批 CY-㊴ 之十四（2026-10-01）：上传体积上限必须**大于**应用侧上限
    # （server/mediaUploadLimits.mjs，视频 300MB）。上面的 64m 是 server 级的历史遗留值，
    # 对上传来说太小 —— nginx 会抢先返回它自己的 413 HTML，用户看到的是一张
    # nginx 错误页，既不是中文，也没有"上限是多少、怎么缩小"。这里放开到 512m，
    # 让**应用**永远是第一个拒绝的地方（它给的是中文 + 真实上限 + 可执行建议）。
    # 只加在 /api/ 里：上传只发生在这里，静态资源不受影响。
    location ^~ /api/ {
        client_max_body_size 512m;
        proxy_pass http://127.0.0.1:3002;
        proxy_http_version 1.1;
        proxy_hide_header X-Content-Type-Options;
        proxy_hide_header X-Frame-Options;
        proxy_hide_header Referrer-Policy;
        proxy_hide_header Permissions-Policy;
        proxy_hide_header Strict-Transport-Security;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_read_timeout 900s;
        proxy_send_timeout 900s;
    }

    location = /health {
        proxy_pass http://127.0.0.1:3002/health;
        proxy_http_version 1.1;
        proxy_hide_header X-Content-Type-Options;
        proxy_hide_header X-Frame-Options;
        proxy_hide_header Referrer-Policy;
        proxy_hide_header Permissions-Policy;
        proxy_hide_header Strict-Transport-Security;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
    }

    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        try_files $uri =404;
    }

    # 9-13 生产事故复盘：静态资源是 1 年 immutable 缓存，但 index.html 原来**没有任何缓存头**，
    # 浏览器会做启发式缓存 —— 部署后旧 HTML 仍指向已被替换的旧 chunk，页面直接打不开。
    # 修法：HTML 强制协商缓存（每次校验），hashed 资源继续长缓存（最优组合）。
    location = /index.html {
        add_header Cache-Control "no-cache, must-revalidate" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    }

    location / {
        # SPA 回退也走 index.html：同样不允许被启发式缓存住
        add_header Cache-Control "no-cache, must-revalidate" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        try_files $uri $uri/ /index.html;
    }
}
